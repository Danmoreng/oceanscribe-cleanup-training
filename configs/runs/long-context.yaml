schema_version: 1
config_type: run
run_name: qwen35-08b-long-context-r32
prompt_contract_version: raw-v1
commands_mode: mixed

model:
  id: Qwen/Qwen3.5-0.8B-Base
  revision: null

resume:
  adapter_path: artifacts/runs/v0-r32-seed42/checkpoints/best
  expected_base_model_revision: REPLACE_WITH_RESOLVED_COMMIT_SHA
  expected_prompt_contract: raw-v1

data:
  subset: long-context
  use_real_contiguous_documents: true

lora:
  rank: 32
  alpha: 64
  dropout: 0.05

training:
  precision: bf16
  optimizer: adamw_torch_fused
  learning_rate: 0.00005
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  use_cache: false
  max_sequence_length: 4096
  packing: false
  truncation: false
  oversize_policy: reject
  eval_strategy: steps
  eval_steps: 100
  save_steps: 100
  logging_steps: 10
  save_total_limit: 3
  seed: 42
  data_seed: 42
  epochs: 1
