[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oceanscribe-cleanup"
version = "0.1.0"
description = "Local transcript-cleanup fine-tuning for OceanScribe"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
oceanscribe-cleanup = "oceanscribe_cleanup.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
train = [
  "accelerate>=1.10,<2",
  "datasets>=4,<5",
  "jiwer>=4,<5",
  "peft>=0.17,<1",
  "rapidfuzz>=3.14,<4",
  "sacrebleu>=2.5,<3",
  "safetensors>=0.6,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.10,<3",
  "transformers>=5.2,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oceanscribe_cleanup"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "model_download: manual integration tests that download model artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
