name: CPU checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync development environment
        run: uv sync --locked --group dev
      - name: Validate configuration contracts
        run: uv run oceanscribe-cleanup validate-configs
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -m "not model_download"
      - name: Build wheel
        run: uv build
      - name: Import from installed wheel
        shell: bash
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel_path"
          uv run --isolated --with "$wheel_path" python -c "import oceanscribe_cleanup"
